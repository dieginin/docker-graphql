name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Git Semantic Version
        id: version
        uses: PaulHatch/semantic-version@v6.0.1
        with:
          major_pattern: 'major:'
          minor_pattern: 'feat:'
          version_format: '${major}.${minor}.${patch}-prerelease${increment}'

      - name: Echo version
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          echo "New version: $NEW_VERSION"
          echo "New version tag: $NEW_VERSION_TAG"

